name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test src
      - run: npm run test:node
      - name: Pack and verify clean installation
        run: |
          npm pack --ignore-scripts
          package_path="$PWD/pavelpernicka-fakturoid-api-$(node -p 'require("./package.json").version').tgz"
          consumer_dir=$(mktemp -d)
          cd "$consumer_dir"
          npm init -y
          npm install --ignore-scripts "$package_path"
          node --input-type=module -e "import { createFakturoidClient } from '@pavelpernicka/fakturoid-api'; if (typeof createFakturoidClient !== 'function') process.exit(1)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: '*.tgz'
          if-no-files-found: error
